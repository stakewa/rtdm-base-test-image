name: Build test fedora bootc image with GitHub actions
on:
  workflow_dispatch:
  push:
    paths:
      - 'image/**'
    branches:
      - master

jobs:
  build:
    name: Build Fedora bootc image
    runs-on: ubuntu-26.04-arm # For ARM64 architecture
    env:
      IMAGE_NAME: rtdm-base-test-image
      REGISTRY: ghcr.io/stakewa

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Use buildah bud to create the image
        id: build-image
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          buildah-image: quay.io/buildah/stable
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          context: "./image"
          containerfiles: |
            ./image/Containerfile

      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Repository
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}
