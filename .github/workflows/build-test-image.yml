name: Build Fedora bootc image with GitHub Actions
on:
  workflow_dispatch:
  push:
    paths:
      - 'image/**'
    branches:
      - master

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  issues: write

jobs:
  build:
    name: Build Fedora bootc image
    runs-on: ubuntu-26.04-arm # For ARM64 architecture
    env:
      IMAGE_NAME: rtdm-base-test-image
      REGISTRY: ghcr.io/stakewa

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Use buildah bud to create the image
        id: build-image
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          buildah-image: quay.io/buildah/stable
          image: ${{ env.IMAGE_NAME }}
          tags: unstable ${{ github.sha }}
          context: "./image"
          containerfiles: |
            ./image/Containerfile

      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Repository
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}
      - name: Create issue for approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.push-to-ghcr.outputs.digest }}
        run: |
          gh issue create \
            --title "New image ${SHA::12} requires testing and approval" \
            --label "unstable-image-release" \
            --body "Approve this issue to give it the latest tag.
          
          When tested, approval can be given by running \`/approve\`
          
          In order to test the base, add the following to the top of the testing Containerfile:
          \`FROM ${IMAGE}@${DIGEST}\`

          Image: \`${IMAGE}\`
          Commit: \`${SHA}\`
          Digest: \`${DIGEST}\`"
